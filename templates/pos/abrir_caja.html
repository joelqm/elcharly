{% extends 'pos/base_interno.html' %}

{% block title %}Apertura de caja · El Charly{% endblock %}

{% block content %}
<div class="pos-topbar">
    <h1>Apertura de <em style="font-style:normal;color:var(--makita);">caja</em></h1>
    <a href="{% url 'pos:hub_inicio' %}" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Volver al inicio</a>
</div>
<div class="pos-body" style="display:flex;justify-content:center;align-items:flex-start;padding-top:40px;">
    <div style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:32px;width:100%;max-width:440px;">
        <div style="text-align:center;margin-bottom:24px;">
            <div style="width:56px;height:56px;border-radius:999px;background:rgba(0,155,148,0.12);color:var(--makita);display:inline-flex;align-items:center;justify-content:center;font-size:1.4rem;margin-bottom:12px;">
                <i class="fa-solid fa-cash-register"></i>
            </div>
            <h2 style="font-family:var(--display);font-size:1.5rem;text-transform:uppercase;">Iniciar turno</h2>
            <p style="color:var(--muted);font-size:0.88rem;margin-top:6px;">Indica el efectivo inicial para vender en tienda.</p>
        </div>
        <form method="post" action="{% url 'pos:abrir_caja' %}" style="display:flex;flex-direction:column;gap:16px;">
            {% csrf_token %}
            <div>
                <label for="sede_id" style="font-weight:700;font-size:0.85rem;display:block;margin-bottom:6px;">Sede</label>
                <select name="sede_id" id="sede_id" required
                        style="width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font:inherit;font-weight:600;">
                    {% for s in sedes %}
                    <option value="{{ s.id }}" {% if user.sede_activa_id == s.id %}selected{% endif %}>
                        {{ s.nombre }} ({{ s.get_tipo_display }})
                    </option>
                    {% empty %}
                    <option value="">No hay sedes — crea Tienda/Taller en admin</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="monto_apertura" style="font-weight:700;font-size:0.85rem;display:block;margin-bottom:6px;">Monto de apertura (S/)</label>
                <input type="number" step="0.01" min="0" name="monto_apertura" id="monto_apertura" required value="100.00"
                       style="width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font:inherit;font-weight:700;font-size:1.05rem;">
            </div>
            <div>
                <label for="observaciones" style="font-weight:700;font-size:0.85rem;display:block;margin-bottom:6px;">Observaciones</label>
                <textarea name="observaciones" id="observaciones" rows="3" placeholder="Ej. Caja principal, turno mañana…"
                          style="width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font:inherit;resize:vertical;"></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;">
                <i class="fa-solid fa-lock-open"></i> Abrir caja y vender
            </button>
        </form>
    </div>
</div>
{% endblock %}
